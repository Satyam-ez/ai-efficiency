# Postgres for the Bug Board backend.
#
# Port 5433 on purpose: 5432 is already taken by another project's container on
# this machine, and this stack must not touch it.
services:
  bugboard_db:
    image: postgres:16
    container_name: bugboard_db
    restart: unless-stopped
    # Credentials come from the git-ignored env file, never from this file.
    env_file: ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - bugboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugboard_pgdata:
