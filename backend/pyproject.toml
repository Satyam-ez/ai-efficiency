[project]
name = "bugboard-backend"
version = "0.1.0"
description = "Django REST backend for the Bug Board"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pillow>=10.4",
]

[tool.uv]
package = false
